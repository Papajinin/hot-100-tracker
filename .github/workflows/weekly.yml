# 매주 빌보드 HOT 100 읽기: 화·수·목 22시(UTC) = 한국 수·목·금 아침 7시
# 빌보드는 미국 화요일에 새 차트를 올림. 이미 넣은 주면 아무것도 안 바뀜 (수·목은 놓쳤을 때 대비)
# 화면 모양이 바뀌어 못 읽으면 실패 → GitHub가 메일로 알려 줌
name: weekly chart
on:
  schedule:
    - cron: '0 22 * * 2,3,4'
  workflow_dispatch: # GitHub 화면에서 손으로 돌리기
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/test.mjs
      - run: node tools/update.mjs
      - name: 바뀌었으면 저장
        run: |
          git config user.name "chart-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "차트 $(node -p "require('./data/state.json').lastChart")" && git push)
