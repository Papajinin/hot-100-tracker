<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 홈 화면 앱: 상태 표시줄을 화면과 겹치지 않게 따로 두고, 아이콘 이름은 Hot 100 Tracker. 항상 검정 화면이라 상태 표시줄도 검정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-title" content="Hot 100">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" href="apple-touch-icon.png?v=2">
  <title>Hot 100 Tracker</title>
  <script>
    // 새 버전 스스로 받기 (가족 앱과 같은 방법): 켤 때 서버의 version.txt 숫자가 아래 APP_VERSION보다 크면
    // 새 화면 파일을 받아 한 번 새로고침. 올릴 때마다 두 숫자를 같이 올린다
    const APP_VERSION = 2;
    (function () {
      const t0 = Date.now();
      const key = 'hot100.updated'; // 같은 버전으로 두 번 새로고침하지 않게
      fetch('version.txt?t=' + t0, { cache: 'no-store' })
        .then(r => r.ok ? r.text() : '')
        .then(txt => {
          const v = parseInt(txt, 10);
          if (!(v > APP_VERSION) || Date.now() - t0 > 4000) return; // 이미 쓰기 시작했으면 다음에 켤 때
          try { if (sessionStorage.getItem(key) === String(v)) return; sessionStorage.setItem(key, String(v)); } catch (e) { return; }
          return Promise.all([fetch(location.pathname, { cache: 'reload' }), fetch('index.html', { cache: 'reload' })])
            .then(() => { if (Date.now() - t0 < 6000) location.reload(); });
        })
        .catch(() => {}); // 인터넷이 안 되면 그냥 염
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <!-- 시작 화면 (앱을 새로 열 때만, 약 2초): 민트 네모가 그려지고 → 막대 세 개가 올라감 → HOT 100 TRACKER (아이콘과 같은 그림) -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-mark">
      <svg viewBox="0 0 180 180"><rect class="sp-box" pathLength="100" x="34" y="34" width="112" height="112"/><rect class="sp-bar" x="58" y="98" width="16" height="28" style="animation-delay:.45s"/><rect class="sp-bar" x="82" y="78" width="16" height="48" style="animation-delay:.6s"/><rect class="sp-bar" x="106" y="56" width="16" height="70" style="animation-delay:.75s"/></svg>
      <div class="sp-word"><div class="logo">HOT 100<small>TRACKER</small></div></div>
    </div>
  </div>

  <div class="app" id="app"></div>

  <script src="app.js?v=4"></script>
</body>
</html>
